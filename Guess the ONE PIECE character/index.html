            // 新增输入联想功能
            function showSuggestions(input) {
    const suggestionsEl = document.getElementById('suggestions');
    if (!input || input.length < 1) {
        suggestionsEl.style.display = 'none';
        return;
    }

    const inputLower = input.toLowerCase().trim();
    
    // 首字母匹配逻辑
    const suggestions = characters.flatMap(char => {
        const localizedName = getLocalizedText(char.name);
        const localizedAliases = getLocalizedText(char.alias) || [];
        
        return [
            localizedName,
            ...localizedAliases
        ].filter(n => n)
         .map(name => ({
            name,
            // 首字母匹配检查
            match: name.toLowerCase().startsWith(inputLower)
        }));
    })
    .filter((item, index, self) =>
        self.findIndex(t => t.name === item.name) === index
    )
    .filter(item => item.match) // 仅保留首字母匹配项
    .slice(0, 5);

    // 渲染建议（保持原有逻辑不变）
    suggestionsEl.innerHTML = suggestions.map(item => `
        <div class="suggestion-item" 
             data-value="${item.name}"
             onclick="this.parentElement.style.display='none';
                      document.getElementById('guess-input').value='${item.name}'">
            ${item.name}
        </div>
    `).join('');

    suggestionsEl.style.display = suggestions.length > 0 ? 'block' : 'none';
}
        }

                    // 空状态不显示内容

            guessed.push(guess);

            const attributes = ['name', 'gender', 'height', 'age', 'race', 'bounty', 'haki', 'devilFruit', 'group', 'debut'];

                col.appendChild(label);

                const valueContainer = document.createElement('div');
                valueContainer.className = 'attribute-value';
                
                let guessValue = guess[attr];

                if (attr === 'haki' || attr === 'devilFruit' || attr === 'group') { // 新增group判断
    const container = document.createElement('div');
    
    // 根据属性类型选择容器样式
    container.className = attr === 'group' ? 'group-container' :

    // 获取标准化数据（支持多语言）
    const guessTypes = getLocalizedText(guess[attr]) || [];

    // 生成独立标签
    guessTypes.forEach(type => {

                } else {

// 键盘导航支持
document.getElementById('guess-input').addEventListener('keydown', function(e) {
    const items = document.querySelectorAll('.suggestion-item');
    if (!items.length) return;

    const focused = document.querySelector('.suggestion-item:hover');
    
    switch(e.key) {
        case 'ArrowDown':
            e.preventDefault();
            if (!focused) items[0].focus();
            else if (focused.nextSibling) focused.nextSibling.focus();
            break;
        case 'ArrowUp':
            e.preventDefault();
            if (focused && focused.previousSibling) {
                focused.previousSibling.focus();
            }
            break;
        case 'Enter':
            if (focused) {
                this.value = focused.dataset.value;
                document.getElementById('suggestions').style.display = 'none';
            }
            break;
    }
});
